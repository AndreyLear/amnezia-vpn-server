# AmneziaWG VPN Server v2
# All versions are intentionally pinned.
# Do not use latest/master in production builds.

# Published container images. install.sh pulls exactly this version from
# GHCR; --build rebuilds the same sources locally instead. The registry
# path must stay lowercase — GHCR rejects anything else.
IMAGE_REGISTRY=ghcr.io/andreylear/amnezia-vpn-server
IMAGE_VERSION=3.1.0

# Go toolchain
GO_VERSION=1.25.12

# Base Linux image
ALPINE_VERSION=3.22.5

# AmneziaWG: движок 3.1, протокол по-прежнему 2.0 — параметры 3.x (защита
# заголовков, добивка, хвосты, тайминги) не задаются, пока клиенты на 1.5 и
# 2.0 (решение владельца 14.09.2026, amnezia-vpn-server-61at)
AMNEZIAWG_GO_VERSION=3.1.20260828
AMNEZIAWG_GO_COMMIT=b5928efb6ca19f0153958460c3d141f04abc5c2e

AMNEZIAWG_TOOLS_VERSION=3.1.20260812
AMNEZIAWG_TOOLS_COMMIT=ee0f0a9aa34ff0a0da4b3433b9512781cfe02843

# Xray: VLESS+XHTTP+Reality на TCP 443 рядом с AWG (эпик amnezia-vpn-server-14y0).
# Образ проекта XTLS, та же версия, что поднята вручную на боевом
# (amnezia-vpn-server-adaw).
XRAY_VERSION=26.10.21
# Узел-вход (install.sh --role entry, amnezia-vpn-server-14y0.6) ставит Xray
# той же версии бинарником из релиза XTLS, без Docker. Архив
# Xray-linux-<arch>.zip сверяется с sha256 ниже (строка SHA2-256 из
# Xray-linux-<arch>.zip.dgst того же релиза); без значения установщик узла
# отказывается ставить Xray.
XRAY_SHA256_LINUX_64=0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978
XRAY_SHA256_LINUX_ARM64_V8A=d1304946c486d98e6b886e9b931eaaaebb23835b30e217638037b7f2721d4e9c

# SQLite Go driver
SQLITE_DRIVER=modernc.org/sqlite
SQLITE_DRIVER_VERSION=1.54.0
# SQLite transitive dependencies
MODERNC_LIBC_VERSION=1.74.1

# Backup / compression
ZSTD_VERSION=1.5.7
ZSTD_GO_MODULE=github.com/klauspost/compress
ZSTD_GO_VERSION=v1.19.2

# Panel: QR encoder (M6.5 on-demand QR), pinned
QRCODE_GO=github.com/skip2/go-qrcode
QRCODE_GO_VERSION=v0.0.0-20200617195104-da1b6568686e
# Panel tests: QR decoder (payload == config verification), pinned
QRDECODE_GO=github.com/makiuchi-d/gozxing
QRDECODE_GO_VERSION=v0.1.1

# Panel: Argon2id password hashing (M7 authentication), pinned
XCRYPTO_GO=golang.org/x/crypto
XCRYPTO_GO_VERSION=v0.54.0

# Panel: Tailwind CSS design-system toolchain (T-120 round 3), pinned.
# Build-only (npm); the compiled artifact static/tailwind.css is committed,
# Go builds/tests stay offline without Node.
TAILWINDCSS_VERSION=4.3.3

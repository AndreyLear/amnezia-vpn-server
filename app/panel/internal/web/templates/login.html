{{define "login"}}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<link rel="stylesheet" href="/static/tailwind.css">
<script src="/static/app.js" defer></script>
</head>
<body class="login-page">
<main class="login-shell">
  <section class="panel login-card" aria-labelledby="login-title">
    <div class="login-brand">
      <span class="panel-logo"></span>
      <span>AmneziaVPN <small>panel</small></span>
    </div>
    <p class="eyebrow">Администрирование VPN</p>
    <h1 id="login-title">Вход в панель</h1>
    <p class="sub">Управляйте туннелем, клиентами и резервными копиями.</p>

    {{if .Error}}<p class="flash flash-error" role="alert">{{.Error}}</p>{{end}}

    <form action="/login" method="post">
      <label class="label">Имя пользователя <input class="input" type="text" name="username" autocomplete="username" required></label>
      {{if not .Passwordless}}<label class="label">Пароль <input class="input" type="password" name="password" autocomplete="current-password" {{if not .NeedCode}}required{{end}}></label>{{end}}
      {{if or .NeedCode .Passwordless}}<label class="label">Код из приложения <input class="input" name="code" inputmode="numeric" pattern="[0-9]{6}" required></label>{{end}}
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p class="login-footnote">Сессия защищена и действует ограниченное время.</p>
  </section>
</main>
</body>
</html>
{{end}}

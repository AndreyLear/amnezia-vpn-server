services:
  # panel-init — одноразовый job: инициализация базы данных и конфигурации
  panel-init:
    image: amnezia-vpn-server/panel:2.0.0
    command: ["/app/panel", "init"]
    volumes:
      # panel-init владеет SQLite и конфигурацией (rw)
      - ./data:/data
      - ./config:/config

  # panel — веб-панель: владеет SQLite и config/awg0.conf
  panel:
    build:
      context: .
      dockerfile: app/panel/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set via versions.lock}
        ALPINE_VERSION: ${ALPINE_VERSION:?ALPINE_VERSION must be set via versions.lock}
    image: amnezia-vpn-server/panel:2.0.0
    command: ["/app/panel", "serve"]
    depends_on:
      panel-init:
        condition: service_completed_successfully
    ports:
      # M6.4 (DEPLOYMENT.md §Ports): the panel binds 0.0.0.0:8787 inside
      # the container; the host mapping is loopback-only until auth lands
      # in M7 — the panel is not exposed to the network.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
      - ./config:/config
      # status читается только для отображения статуса awg
      - ./status:/status:ro
      # M8.7: хранилище резервных копий — только panel (rw);
      # awg backups не получает (ARCHITECTURE.md mount contract)
      - ./backups:/data/backups

  # awg — AmneziaWG runtime: читает конфигурацию, пишет статус
  awg:
    build:
      context: .
      dockerfile: app/awg/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set via versions.lock}
        ALPINE_VERSION: ${ALPINE_VERSION:?ALPINE_VERSION must be set via versions.lock}
        AMNEZIAWG_GO_VERSION: ${AMNEZIAWG_GO_VERSION:?AMNEZIAWG_GO_VERSION must be set via versions.lock}
        AMNEZIAWG_GO_COMMIT: ${AMNEZIAWG_GO_COMMIT:?AMNEZIAWG_GO_COMMIT must be set via versions.lock}
        AMNEZIAWG_TOOLS_VERSION: ${AMNEZIAWG_TOOLS_VERSION:?AMNEZIAWG_TOOLS_VERSION must be set via versions.lock}
        AMNEZIAWG_TOOLS_COMMIT: ${AMNEZIAWG_TOOLS_COMMIT:?AMNEZIAWG_TOOLS_COMMIT must be set via versions.lock}
    image: amnezia-vpn-server/awg:2.0.0
    cap_add:
      - NET_ADMIN
    cap_drop:
      # ТЗ §2: NET_RAW не используется
      - NET_RAW
    devices:
      # userspace-реализация создаёт tun-интерфейс через /dev/net/tun
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # перенаправление трафика между tun и eth0
      net.ipv4.ip_forward: "1"
    depends_on:
      panel-init:
        condition: service_completed_successfully
    volumes:
      # awg видит конфигурацию только на чтение
      - ./config:/config:ro
      # awg пишет актуальный статус runtime для панели
      - ./status:/status

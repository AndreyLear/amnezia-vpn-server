name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/panel/go.mod
      - name: Go tests
        working-directory: app/panel
        run: go test ./...
      - name: Bootstrap harness
        run: bash app/panel/test_m123_bootstrap.sh
      - name: Install harness
        run: bash app/panel/test_m91_install.sh
      - name: Compose topology harness
        run: bash app/panel/test_m92b_compose.sh
      - name: Host network harness
        run: bash app/panel/test_m92_network.sh
      - name: AWG reload harness
        run: bash app/awg/test_m32.sh
      - name: AWG status harness
        run: bash app/awg/test_m5.sh

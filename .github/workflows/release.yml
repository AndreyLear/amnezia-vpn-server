# Builds the three runtime images on GitHub's runners and publishes them to
# GHCR, so a user's VPS downloads ~60 MB of finished binaries instead of
# pulling an 800 MB Go toolchain and compiling amneziawg-go, amneziawg-tools
# and the panel on a single vCPU.
#
# The build itself is unchanged: the same Dockerfiles, with every version
# pinned by versions.lock.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to publish (defaults to versions.lock)"
        required: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # versions.lock stays the single source of pinned versions: the build
      # args below must match what install.sh would have used locally.
      - name: Load versions.lock
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "$key" in
              ''|'#'*) continue ;;
            esac
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < versions.lock

      - name: Resolve image version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$version" ] || version="$IMAGE_VERSION"
          printf 'PUBLISH_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          # A tag must not publish something versions.lock does not describe:
          # the server pulls the version pinned there, not the git tag.
          if [ "$version" != "$IMAGE_VERSION" ]; then
            echo "::error::tag $version does not match IMAGE_VERSION=$IMAGE_VERSION in versions.lock"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version number has to mean exactly one thing, and nothing here
      # made it so: republishing an existing number with different content
      # was allowed, and it happened. 2.3.0 carried two different builds
      # within a week, so a production server and a test server ran
      # different code under the same version — the panel's traffic-direction
      # fix was live on one and missing on the other, and answering "what is
      # actually on this server" took comparing image digests instead of
      # reading a version (amnezia-vpn-server-g68l).
      #
      # Refused here rather than detected afterwards: once published, a
      # version is immutable, and a release that means to change something
      # bumps IMAGE_VERSION in versions.lock. That also means a run which
      # published some images and then failed cannot be retried on the same
      # number — bump it, the cost of a spare version number is nothing next
      # to two servers disagreeing about what 2.3.0 is.
      - name: Refuse to overwrite a published version
        run: |
          set -euo pipefail
          taken=""
          for image in panel awg dns; do
            ref="${IMAGE_REGISTRY}/${image}:${PUBLISH_VERSION}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              taken="${taken} ${ref}"
            fi
          done
          if [ -n "$taken" ]; then
            echo "::error::already published:${taken}. A published version is never rebuilt: raise IMAGE_VERSION in versions.lock and tag the new number."
            exit 1
          fi
          echo "version ${PUBLISH_VERSION} is free in ${IMAGE_REGISTRY}"

      - name: Build and push panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/panel/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/panel:${{ env.PUBLISH_VERSION }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}

      - name: Build and push awg
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/awg/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/awg:${{ env.PUBLISH_VERSION }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            AMNEZIAWG_GO_VERSION=${{ env.AMNEZIAWG_GO_VERSION }}
            AMNEZIAWG_GO_COMMIT=${{ env.AMNEZIAWG_GO_COMMIT }}
            AMNEZIAWG_TOOLS_VERSION=${{ env.AMNEZIAWG_TOOLS_VERSION }}
            AMNEZIAWG_TOOLS_COMMIT=${{ env.AMNEZIAWG_TOOLS_COMMIT }}

      - name: Build and push dns
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/dns/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/dns:${{ env.PUBLISH_VERSION }}
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}

      - name: Summary
        run: |
          {
            printf '### Published\n\n'
            printf -- '- `%s/panel:%s`\n' "$IMAGE_REGISTRY" "$PUBLISH_VERSION"
            printf -- '- `%s/awg:%s`\n' "$IMAGE_REGISTRY" "$PUBLISH_VERSION"
            printf -- '- `%s/dns:%s`\n\n' "$IMAGE_REGISTRY" "$PUBLISH_VERSION"
            printf 'Make all three packages **public** once, or install.sh will need a token to pull them.\n'
          } >> "$GITHUB_STEP_SUMMARY"
